[build-system]
requires = ["hatchling>=1.27", "babel>=2.18,<3", "resvg-py>=0.5,<0.6"]
build-backend = "hatchling.build"

[project]
name = "majsoul-hook-mitm"
version = "0.1.0"
description = "Mahjong Soul local capture with optional client-side cosmetic overrides"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "mitmproxy>=12,<13",
    "protobuf>=7.36.2,<8",
    "UnityPy>=1.23,<2",
    "lupa>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "babel>=2.18,<3"]
build = ["pyinstaller>=6.22.3,<7", "babel>=2.18,<3"]

[project.scripts]
majsoul-hook = "majsoul_hook.cli:main"

[project.gui-scripts]
majsoul-hook-gui = "majsoul_hook.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/majsoul_hook"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README*.md",
    "/AGENTS.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.gitignore",
    "/.gitattributes",
    "/hatch_build.py",
    "/babel.cfg",
    "/release",
    "/.github/workflows",
    "/.github/actions",
    "/Dockerfile",
    "/.dockerignore",
]
exclude = ["*.mo", "/src/majsoul_hook/assets/icon.png"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "README.md" },
    { file = "src/majsoul_hook/locale/**/*.po" },
    { file = "src/majsoul_hook/assets/icon.svg" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
