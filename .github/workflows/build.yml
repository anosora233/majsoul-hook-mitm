name: Build packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.22'
          enable-cache: true
      - uses: ./.github/actions/build-desktop
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-installer.exe
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs-${{ matrix.target }}
          path: |
            build/**/*.log
            build/**/warn-*.txt
          if-no-files-found: ignore
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    timeout-minutes: 40
    steps:
      - name: Install build and display dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y git ca-certificates binutils build-essential xvfb xauth libx11-6 libxext6 libxrender1 libfontconfig1 libxft2 libxss1 libglib2.0-0
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.22'
          enable-cache: true
      - uses: ./.github/actions/build-desktop
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs-${{ matrix.target }}
          path: |
            build/**/*.log
            build/**/warn-*.txt
          if-no-files-found: ignore
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.22'
          enable-cache: true
      - name: Build wheel and source distribution
        run: |
          uv python install
          uv build --out-dir dist/python
      - name: Hash Python packages
        working-directory: dist/python
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-python
          path: dist/python/
          if-no-files-found: error
          compression-level: 0
  release-assets:
    needs: [desktop, linux, python, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.22'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: packages-*
          path: build/release-artifacts
      - name: Verify and collect release packages
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --no-project --python 3.14 python release/prepare_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
  draft-release:
    needs: [release-assets, container-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="release/notes/$RELEASE_TAG.md"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Refusing to change an already published release" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "Majsoul Hook $RELEASE_TAG" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* --draft --verify-tag \
              --title "Majsoul Hook $RELEASE_TAG" --notes-file "$notes"
          fi
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read image metadata
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and inspect image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          ARCH: ${{ matrix.arch }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --tag "$IMAGE:$VERSION-$ARCH" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" .
          docker run --rm "$IMAGE:$VERSION-$ARCH" doctor
      - name: Push verified image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-$ARCH"
          mkdir -p build/digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION-$ARCH" > "build/digests/$ARCH.txt"
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: container-digest-${{ matrix.arch }}
          path: build/digests/*.txt
          if-no-files-found: error
  container-manifest:
    needs: release-assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: container-digest-*
          path: build/digests
          merge-multiple: true
      - name: Publish versioned multi-platform image
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image:$version" \
            "$(cat build/digests/x64.txt)" "$(cat build/digests/arm64.txt)"
          docker buildx imagetools inspect "$image:$version"
          printf 'Container: `%s:%s` (linux/amd64, linux/arm64).\n' "$image" "$version" >> "$GITHUB_STEP_SUMMARY"
